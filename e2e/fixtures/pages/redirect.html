<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iuBlocker e2e — redirect</title>
  </head>
  <body>
    <h1>redirect</h1>
    <!--
      `||127.0.0.1/ads/gpt.js$script,redirect=googletagservices_gpt.js` replaces the
      server script (which sets window.__gptLoaded) with the bundled surrogate (which
      defines window.googletag.cmd).
    -->
    <script src="/ads/gpt.js"></script>
    <p id="result">pending</p>
    <p id="googletag">pending</p>
    <p id="original">pending</p>
    <script>
      (function () {
        var hasSurrogate =
          typeof window.googletag === 'object' && window.googletag !== null && !!window.googletag.cmd;
        var original = window.__gptLoaded === true;
        document.getElementById('googletag').textContent = String(hasSurrogate);
        document.getElementById('original').textContent = String(original);
        document.getElementById('result').textContent = hasSurrogate
          ? 'surrogate'
          : original
            ? 'original'
            : 'blocked';
      })();
    </script>
  </body>
</html>
