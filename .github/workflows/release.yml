name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      has_cws: ${{ steps.secrets.outputs.has_cws }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        id: meta
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
          pnpm exec tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Fetch the live filter lists (fresh)
        run: pnpm rulesets:fetch -- --force

      - name: Compile rulesets
        run: pnpm rulesets:build

      - name: Build the extension
        run: pnpm build

      # Chrome must accept the real-list build before it is packaged
      # (docs/TESTING.md, "Real-list load verification").
      - name: Install Chromium for Playwright
        run: pnpm --dir e2e exec playwright install chromium --with-deps

      - name: Verify the real-list build loads in Chrome
        run: pnpm verify:real

      - name: Package
        run: |
          set -euo pipefail
          pnpm package
          pnpm package -- --dir packages/extension/rulesets --out artifacts/rulesets.zip
          ls -la artifacts

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          assets=("artifacts/iublocker-${VERSION}.zip" artifacts/rulesets.zip packages/extension/rulesets/manifest.json)
          if [ -f packages/extension/rulesets/report.json ]; then assets+=(packages/extension/rulesets/report.json); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "iuBlocker ${VERSION}" \
              --generate-notes
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: |
            artifacts
            packages/extension/rulesets/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Are Chrome Web Store credentials configured?
        id: secrets
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -n "${CWS_CLIENT_ID}" ] && [ -n "${CWS_CLIENT_SECRET}" ] && [ -n "${CWS_REFRESH_TOKEN}" ] && [ -n "${CWS_EXTENSION_ID}" ]; then
            echo "has_cws=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cws=false" >> "$GITHUB_OUTPUT"
            echo "No Chrome Web Store secrets configured — the upload job will be skipped."
          fi

  chrome-web-store:
    name: upload to the Chrome Web Store
    needs: build
    if: needs.build.outputs.has_cws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: .

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: pnpm exec tsx tools/cws-upload.ts --zip "artifacts/iublocker-${VERSION}.zip"
