name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never download browsers implicitly; the e2e job installs Chromium explicitly.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    name: lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (packages)
        run: pnpm typecheck

      - name: Typecheck (tools)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Fetch lists (checked-in snapshot, for determinism)
        run: pnpm rulesets:fetch -- --snapshot e2e/fixtures/lists

      - name: Compile rulesets
        run: pnpm rulesets:build

      - name: Unit tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build extension (e2e flavour)
        run: pnpm build:e2e

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: packages/extension/dist
          if-no-files-found: error
          retention-days: 14

      - name: Install Chromium for Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: pnpm --dir e2e exec playwright install chromium --with-deps

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
